<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#222;
}
.header{
  background:#111827;
  color:white;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}
.container{padding:20px}
.welcome{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}
.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}
.card h3{font-size:15px;color:#666}
.card p{
  font-size:28px;
  font-weight:bold;
  margin-top:8px;
}
.menu{
  margin-top:20px;
  display:grid;
  gap:12px;
}
button{
  border:0;
  padding:15px;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
}
.logout{background:#dc2626}
</style>
</head>

<body>

<div class="header">
  Admin Panel
</div>

<div class="container">

  <div class="welcome">
    <h2>Welcome Admin 👋</h2>
    <p style="margin-top:8px;color:#666">
      यहाँ से आप अपने पैनल को मैनेज कर सकते हैं।
    </p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>Total Users</h3>
      <p>120</p>
    </div>

    <div class="card">
      <h3>Active Users</h3>
      <p>85</p>
    </div>

    <div class="card">
      <h3>Total Posts</h3>
      <p>45</p>
    </div>

    <div class="card">
      <h3>Messages</h3>
      <p>18</p>
    </div>

  </div>

  <div class="menu">
    <button onclick="alert('Users section')">
      👥 Manage Users
    </button>

    <button onclick="alert('Posts section')">
      📝 Manage Posts
    </button>

    <button onclick="alert('Settings section')">
      ⚙️ Settings
    </button>

    <button class="logout" onclick="alert('Logout')">
      🚪 Logout
    </button>
  </div>

</div>

</body>
</html>
